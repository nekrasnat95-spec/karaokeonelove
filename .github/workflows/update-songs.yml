name: Обновить списки песен

on:
  workflow_dispatch: # кнопка «Run workflow» во вкладке Actions
  # Автозапуск по понедельникам выключен, пока песни задаём вручную.
  # Чтобы включить, убери решётки:
  # schedule:
  #   - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: update-songs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Собрать песни из Last.fm
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: node scripts/fetch-songs.mjs
      - name: Сохранить в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "Изменений нет" && exit 0
          git commit -m "Обновить списки песен"
          git push
